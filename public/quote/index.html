<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AllyNutra · Quote + BQA (Merged, Option F)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Roboto+Slab:wght@400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap">
<!-- AN-DEMO role switch (feature/role-and-links) — presentation-only, no auth.
     Relative path: this file is served one level under the site root
     (/ally-nutra-landing/quote/), so ../shared/ resolves correctly under
     Vite's configured base path in dev, preview, and the deployed GitHub
     Pages build alike, without hardcoding the base path here. -->
<script defer src="../shared/demo-role.js"></script>
<style>
  /* ── AllyNutra tokens — AN-DESIGN-001 canonical hex (verified against
     scripts/palette-lint.mjs's ALLOWED_HEX set). Navy carries the brand;
     amber is a single functional mark per view. Every non-canonical value
     is either an allowed hex or an rgba() of an allowed hex's RGB triple
     (palette-lint's "token + alpha" exemption) — see PR body for the full
     remap table. */
  :root{
    --ally-navy:#1E3A5F; --ally-navy-2:#2E5D9E; --ally-navy-line:rgba(30,58,95,.35);
    --ally-amber:#F0A829; --ally-amber-deep:#9A6B12;
    /* alpha kept low deliberately: amber-deep text on this tint composited over white
       measures 4.52:1 at .05 vs 4.37:1 (fails AA) at the .10 originally used for
       decorative amber-tint fills elsewhere — see PR body contrast audit. */
    --ally-amber-tint:rgba(240,168,41,0.05); --ally-amber-tint-line:rgba(240,168,41,0.35);
    --text-primary:#18181B; --text-body:#18181B; --text-secondary:#71717A;
    --text-muted:#71717A; --text-meta:#71717A;
    --color-accent-text:var(--ally-amber-deep);
    --surface-page:#ECEAE6; --surface-card:#FFFFFF;
    --surface-muted:#F4F4F5;
    --border-default:#E4E4E7; --border-hairline:#E4E4E7;
    --radius:6px; --radius-lg:8px;
    --destructive:#DC474C;
    --review-bg:rgba(30,58,95,.08); --review-line:rgba(30,58,95,.22);
    --font-display:'Roboto Slab',Georgia,'Times New Roman',serif;
    --font-text:'Roboto',Helvetica,Arial,sans-serif;
    --font-num:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font-text);background:var(--ally-navy);color:var(--text-body);-webkit-font-smoothing:antialiased}
  .app{min-height:100vh;display:flex;flex-direction:column}
  input::placeholder,textarea::placeholder{color:var(--text-muted)}
  button{font-family:inherit;cursor:pointer}
  a:focus-visible,button:focus-visible{outline:2px solid var(--ally-amber);outline-offset:1px}
  @keyframes fade-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .fu{animation:fade-in .22s cubic-bezier(.4,0,.2,1) both}
  @media (prefers-reduced-motion:reduce){.fu{animation:none}}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* review-tool masthead (visually set apart from the mocked product) */
  header.rev{position:relative;z-index:50;background:var(--ally-navy);border-bottom:1px solid var(--ally-navy-line);padding:12px 24px;flex:none}
  header.rev .row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  /* .logo carries no type rules — the anchor holds only the logo-white.png
     image (46px, shared with quote/portal/admin/schedule; see the PR body's
     nav spec block for why 46px). There's no text to style and nothing to
     hover: it's a home link, not a nav item. */
  .revtag{font-family:var(--font-num);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.75);background:rgba(255,255,255,.06);border:1px dashed rgba(255,255,255,.28);border-radius:99px;padding:4px 11px}
  .swbtn{margin-left:auto;font-size:12.5px;font-weight:600;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.35);border-radius:var(--radius);padding:8px 13px;display:flex;align-items:center;gap:7px}
  .swbtn:hover{background:rgba(255,255,255,.16)}
  .swbtn svg{transition:transform .14s ease}
  .swpanel.open + .swbtn svg,.sw.open .swbtn svg{transform:rotate(180deg)}

  .sw{position:relative}
  .swpanel{position:absolute;right:0;top:calc(100% + 8px);width:420px;max-height:74vh;overflow-y:auto;background:#fff;border:1px solid var(--border-default);border-radius:var(--radius-lg);box-shadow:0 10px 30px -6px rgba(0,0,0,.22);z-index:80;opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .14s ease,transform .14s ease;padding:14px}
  .sw.open .swpanel{opacity:1;transform:none;pointer-events:auto}
  .sw-grp{margin-bottom:12px}
  .sw-grp:last-child{margin-bottom:0}
  .sw-grp h6{font-family:var(--font-num);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-meta);margin-bottom:7px}
  .sw-row{display:flex;flex-wrap:wrap;gap:6px}
  .sw-chip{font-size:12px;font-weight:600;color:var(--ally-navy);background:var(--review-bg);border:1px solid var(--review-line);border-radius:99px;padding:5px 11px}
  .sw-chip:hover{background:rgba(30,58,95,.12)}
  .sw-chip.current{background:var(--ally-navy);border-color:var(--ally-navy);color:#fff}
  .sw-reset{width:100%;margin-top:4px;font-size:12px;font-weight:600;color:var(--destructive);background:none;border:1px dashed var(--destructive);border-radius:var(--radius);padding:7px}

  /* portal shell */
  .region{flex:1;overflow-y:auto;background:var(--surface-page);display:flex;justify-content:center}
  .wrap{width:100%;max-width:840px;padding:36px 20px 64px}
  .content .screen{display:none}
  .content .screen.on{display:block}

  h2.pg{font-family:var(--font-display);font-size:24px;font-weight:500;letter-spacing:-0.01em;color:var(--text-primary)}
  .lede{font-size:15px;color:var(--text-secondary)}

  /* single top-of-page masthead (replaces the old per-screen dark pghead
     banner — the merged single-page layout has one flowing light-surface
     header instead of a wizard "screen 1" banner). Given a white card
     background (not the bare beige page bg) because measurement showed
     amber-ink only clears 4.5:1 against white/near-white, not against
     --surface-page's #ECEAE6 (measures 3.90:1 there) — see PR body. */
  .pagehead{margin-bottom:20px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:var(--radius-lg);padding:22px 24px}
  .pagehead .eyebrow{display:flex;align-items:center;gap:9px;font-family:var(--font-num);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--color-accent-text);margin-bottom:10px}
  .pagehead .eyebrow::before{content:"";width:20px;height:1px;background:var(--color-accent-text);opacity:.75}
  .pagehead h2.pg{font-weight:600;letter-spacing:-0.015em}
  .pagehead .lede{margin-top:7px;max-width:64ch;line-height:1.55}

  .btn-navy{font-size:13px;font-weight:600;color:#fff;background:var(--ally-navy);border:none;border-radius:var(--radius);padding:10px 16px;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
  .btn-navy:hover{filter:brightness(.88)}
  .btn-navy:disabled{opacity:.42;cursor:not-allowed;filter:none}
  .btn-out{font-size:13px;font-weight:600;color:var(--ally-navy);background:var(--surface-card);border:1px solid var(--ally-navy);border-radius:var(--radius);padding:9px 15px;white-space:nowrap}
  .btn-out:hover{background:var(--surface-muted)}
  .btn-ghost{font-size:12.5px;font-weight:600;color:var(--text-secondary);background:none;border:none;padding:9px 6px}
  .btn-ghost:hover{color:var(--text-primary)}

  .card{background:var(--surface-card);border:1px solid var(--border-default);border-radius:var(--radius-lg);overflow:hidden}
  .cardpad{padding:22px 24px}
  .num{font-family:var(--font-num)}
  .meta{font-family:var(--font-num);font-size:10.5px;letter-spacing:.05em;color:var(--text-meta);text-transform:uppercase}

  .pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:4px 12px;font-size:12px;font-weight:600}
  .pill .d{width:6px;height:6px;border-radius:50%}
  .pill.gold{background:var(--ally-amber-tint);color:var(--color-accent-text)} .pill.gold .d{background:var(--ally-amber)}
  .pill.navy{background:rgba(30,58,95,.08);color:var(--ally-navy)} .pill.navy .d{background:var(--ally-navy)}
  /* card, not surface-muted: text-secondary on surface-muted measures 4.40:1 (fails
     AA); on card it measures 4.83:1. Border added so the pill keeps a visible edge
     against the white resultcard it sits on — see PR body contrast audit. */
  .pill.slate{background:var(--surface-card);color:var(--text-secondary);border:1px solid var(--border-default)} .pill.slate .d{background:var(--text-muted)}

  .note{display:flex;align-items:flex-start;gap:10px;padding:13px 15px;background:var(--ally-amber-tint);border:1px solid var(--ally-amber-tint-line);border-radius:var(--radius);font-size:12.5px;color:var(--text-primary);line-height:1.5}

  /* field basics */
  label.fl{display:block;font-size:12.5px;font-weight:600;color:var(--text-primary);margin-bottom:6px}
  input.fi,select.fi,textarea.fi{width:100%;font-family:inherit;font-size:13.5px;color:var(--text-primary);background:var(--surface-card);border:1px solid var(--border-default);border-radius:var(--radius);padding:10px 12px}
  input.fi:focus,select.fi:focus,textarea.fi:focus{outline:none;border-color:var(--ally-navy)}
  input.fi:disabled{background:var(--surface-muted);color:var(--text-muted)}
  textarea.fi{resize:vertical;min-height:80px;line-height:1.5}
  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .fgroup{margin-bottom:16px}
  .fhelp{font-size:11.5px;color:var(--text-muted);margin-top:5px}

  /* tappable option cards (lead type / delivery format) */
  .optgrid{display:grid;gap:10px}
  .optgrid.two{grid-template-columns:1fr 1fr}
  .opt{display:flex;align-items:flex-start;gap:12px;text-align:left;padding:14px 15px;border:1px solid var(--border-default);border-radius:var(--radius-lg);background:var(--surface-card)}
  .opt:hover{border-color:var(--ally-navy)}
  .opt.sel{border-color:var(--ally-navy);border-width:2px;background:rgba(30,58,95,.03)}
  .opt .oi{flex:none;width:34px;height:34px;border-radius:var(--radius);background:var(--surface-muted);color:var(--ally-navy);display:flex;align-items:center;justify-content:center}
  .opt.sel .oi{background:var(--ally-navy);color:#fff}
  .opt .on{font-size:14px;font-weight:600;color:var(--text-primary)}
  .opt .od{font-size:12px;color:var(--text-secondary);margin-top:3px;line-height:1.4}
  .opt.muted{opacity:.55}
  .opt.muted .oi{background:var(--surface-muted);color:var(--text-muted)}

  .tabs{display:flex;gap:2px;margin:16px 0;border-bottom:1px solid var(--border-hairline)}
  .tab{font-size:13px;font-weight:500;color:var(--text-secondary);background:none;border:none;padding:9px 4px;margin-right:18px;border-bottom:2px solid transparent}
  .tab.on{color:var(--text-primary);border-bottom-color:var(--ally-amber)}

  /* stepper — booking sub-flow only (Intro/Schedule/Confirmed). The merged
     block list itself has no step counter (spec §0). */
  .stepper{display:flex;align-items:flex-start}
  .step{flex:1;display:flex;flex-direction:column;align-items:center}
  .step .line{display:flex;align-items:center;width:100%}
  .step .conn{flex:1;height:2px;background:var(--border-default)}
  .step .conn.done{background:var(--ally-amber)}
  .step .conn.hide{background:transparent}
  .step .dot{width:26px;height:26px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;font-family:var(--font-num);border:2px solid var(--border-default);background:var(--surface-card);color:var(--text-muted)}
  .step .dot.done{background:var(--ally-amber);border-color:var(--ally-amber);color:#fff}
  .step .dot.now{background:var(--surface-card);border-color:var(--ally-navy);color:var(--ally-navy)}
  .step .lbl{font-size:10.5px;color:var(--text-secondary);margin-top:7px;text-align:center;line-height:1.3}
  .step .lbl.now{color:var(--text-primary);font-weight:600}

  /* ingredient table */
  .ingtable{border:1px solid var(--border-default);border-radius:var(--radius);overflow:hidden;margin-bottom:8px}
  .ingrow{display:grid;grid-template-columns:2fr 1fr 1fr 32px;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border-hairline);align-items:center}
  .ingrow:last-child{border-bottom:none}
  /* card, not surface-muted — same 4.40:1→4.83:1 fix as .pill.slate above; the
     existing border-bottom (shared with data rows) still separates the header. */
  .ingrow.head{background:var(--surface-card);font-family:var(--font-num);font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-meta)}
  .ingrow input{width:100%;font-size:13px;border:1px solid var(--border-default);border-radius:4px;padding:6px 8px;font-family:inherit}
  .ingrow .rm{width:26px;height:26px;border-radius:99px;border:1px solid var(--border-default);background:var(--surface-card);color:var(--text-muted);display:flex;align-items:center;justify-content:center}
  .ingrow .rm:hover{border-color:var(--destructive);color:var(--destructive)}
  .adder{font-size:12.5px;font-weight:600;color:var(--ally-navy);background:none;border:1px dashed var(--ally-navy-line);border-radius:var(--radius);padding:8px 12px;width:100%}
  .adder:hover{background:rgba(30,58,95,.04)}

  .dropzone{border:1px dashed var(--ally-amber-tint-line);background:rgba(240,168,41,.04);border-radius:var(--radius-lg);padding:16px 18px;display:flex;align-items:center;gap:14px;margin-bottom:16px}
  .dropzone .dz-ic{flex:none;width:38px;height:38px;border-radius:var(--radius);background:var(--surface-card);border:1px solid var(--ally-amber-tint-line);display:flex;align-items:center;justify-content:center;color:var(--ally-amber-deep)}

  .divider{display:flex;align-items:center;gap:12px;margin:18px 0;font-size:11.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border-hairline)}

  /* review recap */
  /* card, not surface-muted: .recrow .rk (text-secondary) measures 4.40:1 on
     surface-muted (fails AA), 4.83:1 on card. Existing border keeps the box
     legible as a distinct panel. */
  .recap{background:var(--surface-card);border:1px solid var(--border-default);border-radius:var(--radius-lg);padding:16px 18px;margin-bottom:20px}
  .recap h4{font-family:var(--font-display);font-size:15px;font-weight:600;color:var(--text-primary);margin-bottom:12px}
  .recrow{display:flex;justify-content:space-between;gap:16px;padding:7px 0;border-top:1px solid var(--border-hairline);font-size:13px}
  .recrow:first-of-type{border-top:none}
  .recrow .rk{color:var(--text-secondary)}
  .recrow .rv{color:var(--text-primary);font-weight:500;text-align:right}

  .consent{display:flex;gap:10px;align-items:flex-start;padding:12px 0;font-size:12px;line-height:1.55;color:var(--text-secondary)}
  .consent input{margin-top:3px;flex:none}
  .consent p{margin:0}

  /* BQA option rows (reused inside blocks 3/5/7) */
  .qeyebrow{font-family:var(--font-num);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-meta);margin-bottom:8px}
  .qtitle{font-family:var(--font-display);font-size:19px;font-weight:600;color:var(--text-primary);margin-bottom:18px;line-height:1.35}

  /* centered header + card chrome reused by result/booking full-screen states.
     Given the same white-card treatment as .pagehead (background/border/padding):
     .eyebrow2 (amber-deep) measures 3.90:1 directly on --surface-page (fails AA),
     4.68:1 on card; .sub (text-secondary) measures 4.02:1 on --surface-page,
     4.83:1 on card. See PR body contrast audit. */
  .bqahead{text-align:center;max-width:560px;margin:0 auto 26px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:var(--radius-lg);padding:24px 26px 26px}
  .bqahead .eyebrow2{font-family:var(--font-num);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--color-accent-text);margin-bottom:10px}
  .bqahead h1{font-family:var(--font-display);font-size:26px;font-weight:600;color:var(--text-primary);letter-spacing:-0.01em;line-height:1.25}
  .bqahead .sub{font-size:13.5px;color:var(--text-secondary);margin-top:9px;line-height:1.5}
  .qcard{background:var(--surface-card);border:1px solid var(--border-default);border-radius:var(--radius-lg);padding:26px 28px}
  .qfoot{display:flex;align-items:center;justify-content:space-between;margin-top:20px;padding-top:16px;border-top:1px solid var(--border-hairline)}
  .qcount{font-size:12px;color:var(--text-muted)}

  .optionrow{display:flex;align-items:center;gap:12px;padding:13px 15px;border:1px solid var(--border-default);border-radius:var(--radius);margin-bottom:8px;background:var(--surface-card);width:100%;text-align:left}
  .optionrow:hover{border-color:var(--ally-navy)}
  .optionrow.sel{border-color:var(--ally-navy);background:rgba(30,58,95,.03)}
  .optionrow .rd{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--border-default);position:relative}
  .optionrow.sel .rd{border-color:var(--ally-navy)}
  .optionrow.sel .rd::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--ally-navy)}
  .optionrow .ot{font-size:13.5px;color:var(--text-primary);flex:1}
  .optionrow.branch{flex-direction:column;align-items:stretch}
  .optionrow.branch .bh{display:flex;align-items:center;gap:12px;width:100%}
  .optionrow.branch .chev{margin-left:auto;color:var(--text-muted);transition:transform .14s ease}
  .optionrow.branch.open .chev{transform:rotate(180deg)}
  .subopts{margin:12px 0 2px 30px;display:none;flex-direction:column;gap:8px}
  .optionrow.branch.open .subopts{display:flex}
  .subopt{display:flex;align-items:center;gap:10px;padding:10px 13px;border:1px solid var(--border-default);border-radius:var(--radius);background:var(--surface-muted);width:100%;text-align:left}
  .subopt:hover{border-color:var(--ally-navy)}
  .subopt.sel{border-color:var(--ally-navy);background:rgba(30,58,95,.05)}
  .subopt .st{font-size:13px;color:var(--text-primary)}
  .subopt .sd{font-size:11.5px;color:var(--text-secondary);margin-top:1px}

  .phonenudge{display:flex;align-items:center;gap:9px;margin-top:18px;padding-top:16px;border-top:1px solid var(--border-hairline);font-size:13px;color:var(--text-secondary)}
  .phonenudge a{color:var(--ally-navy);font-weight:600}

  /* ack modal */
  .modalbg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:70;padding:20px}
  .modalbg.open{display:flex}
  .modal{background:#fff;border-radius:var(--radius-lg);max-width:420px;width:100%;padding:24px 26px;box-shadow:0 20px 50px -10px rgba(0,0,0,.35)}
  .modal h3{font-family:var(--font-display);font-size:17px;font-weight:600;color:var(--text-primary);margin-bottom:10px}
  .modal p{font-size:13.5px;color:var(--text-secondary);line-height:1.55;margin-bottom:18px}
  .modal .mrow{display:flex;gap:10px;justify-content:flex-end}

  /* result */
  .resultcard{background:var(--surface-card);border:1px solid var(--border-default);border-radius:var(--radius-lg);padding:30px 32px;text-align:center;max-width:520px;margin:0 auto}
  .rbadge{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
  .rbadge.qualified{background:var(--ally-amber-tint);color:var(--ally-amber-deep)}
  .rbadge.review{background:rgba(30,58,95,.08);color:var(--ally-navy)}
  /* card, not surface-muted — same 4.40:1→4.83:1 fix as .pill.slate above. */
  .rbadge.waitlisted{background:var(--surface-card);color:var(--text-muted);border:2px solid var(--border-default)}
  .rpill{margin-bottom:14px}
  .resultcard h1{font-family:var(--font-display);font-size:24px;font-weight:600;color:var(--text-primary);margin-bottom:12px;letter-spacing:-0.01em}
  .resultcard .rbody{font-size:14.5px;color:var(--text-secondary);line-height:1.6;max-width:40ch;margin:0 auto}
  .resultcard .ractions{margin-top:22px;display:flex;justify-content:center;gap:12px}
  /* card, not surface-muted: .whatnext h5 (text-meta) measures 4.40:1 on
     surface-muted (fails AA), 4.83:1 on card. Existing border keeps the box
     legible as a distinct panel. */
  .whatnext{text-align:left;background:var(--surface-card);border:1px solid var(--border-default);border-radius:var(--radius);padding:16px 18px;margin-top:20px}
  .whatnext h5{font-family:var(--font-num);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-meta);margin-bottom:10px}
  .whatnext li{font-size:13px;color:var(--text-body);line-height:1.6;margin-left:16px;margin-bottom:4px}
  .redirtext{margin-top:14px;font-size:12px;color:var(--text-muted)}

  .spin{width:16px;height:16px;flex:none;border-radius:50%;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;display:inline-block;animation:spin .7s linear infinite}
  .spin.dark{border-color:var(--border-default);border-top-color:var(--ally-navy)}
  .scoringcard{text-align:center;padding:60px 20px}

// ── real copy pulled from src/pages/Quote.tsx (DeliveryFormatStep + quoteOptions.ts) ──

function stepperHtml(steps){
  return steps.map((s,i)=>{
    const first=i===0, last=i===steps.length-1;
    const ldone = s.state==='done' || (i>0 && steps[i-1].state==='done');
    const rdone = s.state==='done';
    const dotCls = s.state==='done'?'done':s.state==='now'?'now':'';
    const mark = s.state==='done'?'✓':(i+1);
    return `<div class="step">
      <div class="line">
        <div class="conn ${first?'hide':(ldone?'done':'')}"></div>
        <div class="dot ${dotCls}">${mark}</div>
        <div class="conn ${last?'hide':(rdone?'done':'')}"></div>
      </div>
      <div class="lbl ${s.state==='now'?'now':''}">${s.name}</div>
    </div>`;
  }).join('');
}

function setDeep(path, val){
  const parts = path.split('.'); let obj = S;
  for(let i=0;i<parts.length-1;i++) obj = obj[parts[i]];
  obj[parts[parts.length-1]] = val;
}
function scrollToBlock(id){
  requestAnimationFrame(()=>{
    const el = document.getElementById('blk-'+id);
    if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
  });
}

document.addEventListener('click', e=>{
  // switcher toggle
  const swBtn = e.target.closest('#swBtn');
  if(swBtn){ document.getElementById('sw').classList.toggle('open'); return; }
  if(!e.target.closest('#sw')) document.getElementById('sw').classList.remove('open');

  const jump = e.target.closest('[data-jump]'); if(jump){ go(jump.dataset.jump); closeSwitcher(); return; }
  const jumpblk = e.target.closest('[data-jumpblk]');
  if(jumpblk){
    const id = +jumpblk.dataset.jumpblk;
    for(let n=1;n<id;n++) S.done[n]=true; // design-review tool: jump anywhere regardless of flow gating
    S.open = id;
    go('blocks'); closeSwitcher(); scrollToBlock(id); return;
  }
  const jumpr = e.target.closest('[data-jumpr]'); if(jumpr){ S.result.outcome=jumpr.dataset.jumpr; S.result.committed=false; go('result'); closeSwitcher(); return; }
  const jumpsub = e.target.closest('[data-jumpsubmit]'); if(jumpsub){ if(!S.result.outcome) S.result.outcome='qualified'; S.result.committed=true; go('result'); closeSwitcher(); return; }
  const resetAll = e.target.closest('[data-resetall]');
  if(resetAll){
    S.open=1; S.done={1:false,2:false,3:false,4:false,5:false,6:false,7:false,8:false};
    S.bqa.a1=S.bqa.a2=S.bqa.a3=null;
    S.bqa.ackedQ2={pilot:false,sample:false}; S.bqa.pendingAck=null; S.bqa.q2Open=false;
    S.result.outcome=null; S.result.committed=false; S.result.submitting=false;
    S.booking.origin=null; S.booking.date=null; S.booking.slot=null;
    go('blocks'); closeSwitcher(); return;
  }

  const nav = e.target.closest('[data-nav]'); if(nav){ go(nav.dataset.nav); return; }

  // NOTE (OPEN QUESTION #4, verbatim from source): this "idea, need help refining"
  // shortcut existed unchanged in the original wizard (also named data-idea-start) and
  // bypasses blocks 2-8 and the entire score/gate sequence entirely, going straight to
  // booking. The merged-flow spec doesn't describe this branch. Kept as-is (matches
  // current production behavior) rather than silently removed or silently folded into
  // the block sequence — see PR body OPEN QUESTIONS.
  const ideaStart = e.target.closest('[data-idea-start]');
  if(ideaStart){ S.q.leadType='needs-refining'; S.booking.origin='idea'; go('booking-intro'); return; }

  // block header click — reopen a done block, or no-op on a locked one
  const blkHead = e.target.closest('[data-blkhead]');
  if(blkHead){
    if(blkHead.disabled) return;
    const id = +blkHead.dataset.blkhead;
    S.open = (S.open===id) ? S.open : id;
    render(); scrollToBlock(id); return;
  }

  // block Continue — marks the block done, returns focus to the frontier
  // (blocks below keep their answers; editing an earlier done block does
  // not force the user back through everything in between)
  const blockNext = e.target.closest('[data-blocknext]');
  if(blockNext){
    const id = +blockNext.dataset.blocknext;
    S.done[id] = true;
    if(id===8){
      S.open = 9;
      go('scoring');
      setTimeout(()=>{ S.result.outcome = scoreToOutcome(bqaScore()); S.result.committed=false; go('result'); }, 700);
      return;
    }
    S.open = firstUndone();
    render(); scrollToBlock(S.open); return;
  }

  const optset = e.target.closest('[data-set]');
  if(optset){ setDeep(optset.dataset.set, optset.dataset.val); render(); return; }

  const addIng = e.target.closest('[data-addIng]');
  if(addIng){ S.q.ingredients.push({name:'',amount:'',unit:'mg'}); render(); return; }
  const rmIng = e.target.closest('[data-rmIng]');
  if(rmIng){ S.q.ingredients.splice(+rmIng.dataset.rmIng,1); render(); return; }

  // Q2 parent/leaf accordion (block 5). The parent only toggles the reveal —
  // it never records an answer. A leaf click either opens the ack modal
  // (unacked pilot/sample — answer withheld until confirm) or sets
  // S.bqa.a2 directly (the one-off leaf, or an already-acknowledged leaf).
  const q2branch = e.target.closest('[data-q2branchtoggle]');
  if(q2branch){ S.bqa.q2Open = !S.bqa.q2Open; render(); return; }
  const q2leaf = e.target.closest('[data-q2leaf]');
  if(q2leaf){
    const idx = +q2leaf.dataset.q2leaf;
    const ackKey = q2leaf.dataset.q2ack;
    if(ackKey && !S.bqa.ackedQ2[ackKey]){
      S.bqa.pendingAck = ackKey;
      openAck(ackKey);
      return;
    }
    S.bqa.a2 = idx;
    render();
    return;
  }
  const ackOk = e.target.closest('[data-ackok]');
  if(ackOk){
    const key = ackOk.dataset.ackok;
    S.bqa.ackedQ2[key] = true;
    S.bqa.a2 = Q2_OPTS.findIndex(o=>o.ackKey===key);
    S.bqa.pendingAck = null;
    closeAck();
    render();
    return;
  }
  if(e.target.closest('[data-ackcancel]')){ S.bqa.pendingAck=null; closeAck(); return; }

  // BQA radios (blocks 3 / 5 / 7)
  const radio = e.target.closest('[data-radio]');
  if(radio){
    const name = radio.dataset.radio, idx = +radio.dataset.idx;
    if(name==='bqa-a1') S.bqa.a1 = idx;
    if(name==='bqa-a2') S.bqa.a2 = idx;
    if(name==='bqa-a3') S.bqa.a3 = idx;
    render(); return;
  }

  const nudge = e.target.closest('[data-nudge]'); if(nudge){ e.preventDefault(); /* logged as bqa_call_nudge_exit in production; no-op here */ return; }

  const bookingBack = e.target.closest('[data-bookingback]');
  if(bookingBack){ go(S.booking.origin==='idea' ? 'blocks' : 'result'); return; }
  const bookingNext = e.target.closest('[data-bookingnext]');
  if(bookingNext){
    go('booking-confirming');
    setTimeout(()=>{ go('booking-confirmed'); }, 700);
    return;
  }
  const scheduleCall = e.target.closest('[data-schedule-call]');
  if(scheduleCall){ S.booking.origin='qualified'; go('booking-intro'); return; }

  const submitReq = e.target.closest('[data-submitreq]');
  if(submitReq){
    S.result.submitting = true; render();
    setTimeout(()=>{ S.result.submitting=false; S.result.committed=true; render(); }, 550);
    return;
  }
});

document.addEventListener('input', e=>{
  const bind = e.target.closest('[data-bind]');
  if(bind){ setDeep(bind.dataset.bind, e.target.value); return; }
  const ing = e.target.closest('[data-ing]');
  if(ing){ const [i,field] = ing.dataset.ing.split('.'); S.q.ingredients[i][field] = e.target.value; return; }
});
document.addEventListener('change', e=>{
  const bind = e.target.closest('[data-bind]');
  if(bind && (e.target.tagName==='SELECT')){ setDeep(bind.dataset.bind, e.target.value); render(); return; }
  const check = e.target.closest('[data-check]');
  if(check){ setDeep(check.dataset.check, e.target.checked); return; }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ S.bqa.pendingAck=null; closeAck(); document.getElementById('sw').classList.remove('open'); } });

render();
</script>
</body>
</html>
